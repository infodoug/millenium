<link rel="stylesheet" href="../components/new-post/new-post.css" />

<body>
  <div class="newpostdiv">
    <div class="formContainer">
      <form enctype="multipart/form-data" method="POST">
        <!-- <input class="input-text" name="post" type="text" /> -->
        <input type="hidden" name="action" value="make_post">
        <!-- preview da imagem do post -->
        <div id="previewBox">
          <img id="imagePreview" src="#" alt="Preview da imagem">
          <div class="removeImage-button">
            <img src="../assets/icons/x-gray.png" alt="">
          </div>
        </div>
        <!-- <textarea class="input-text" name="post" rows="1"></textarea> -->
        <div id="editor-postagem" class="input-text" name="post" contenteditable="true" class="editor" placeholder="Digite o texto do post..."></div>
        <button class="emojiButton" type="button">
          <img src="../assets/icons/emoticons/smiling.png" alt="">
        </button>
        <div id="emoji-picker-container" style="display: none; position: absolute; z-index: 10;"></div>
        <label for="arquivo">
          <img class="add-image" src="../assets/icons/addImg.png" alt="falha" />
          <p>Adicionar Imagem</p>
        </label>
        <input name="arquivo" type="file" id="arquivo" />

        <button class="buttonLaunch" type="submit">
          <img src="../assets/icons/rocket.png" alt="">
          Lançar
        </button>
      </form>
    </div>
  </div>

  <script>
document.querySelector('#novo-post form').addEventListener('submit', function(e) {
    const editorDiv = document.getElementById('editor-postagem'); // Usa a ID específica
    
    if (editorDiv.innerHTML.trim() === '') {
        e.preventDefault();
        alert('Digite algo para postar!');
        return;
    }
    
    const hiddenInput = document.createElement('input');
    hiddenInput.type = 'hidden';
    hiddenInput.name = 'post';
    hiddenInput.value = editorDiv.innerHTML; 
    this.appendChild(hiddenInput);
});


  </script>
</body>
